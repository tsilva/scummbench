name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check.js
      - run: node --test test/*.test.js
      - run: python3 -B -m unittest discover -s python_tests -v
      - run: python3 -B -m unittest discover -s test -p "test_*.py" -v
      - run: python3 -B -m unittest discover -s .github/scripts -p test_production_delivery.py
      - run: node scripts/build-results.js
